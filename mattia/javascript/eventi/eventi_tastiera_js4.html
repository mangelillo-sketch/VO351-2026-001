<!DOCTYPE html>
<html>
    <head>
        <title>Eventi in Javascript</title>
        <style>
            div{
                border: 1px solid;
                width: 150px;
                height: 150px;
            }
        </style>
    </head>
    <body>
        
        <p id="paragrafo">
            Lorem ipsum dolor sit, amet consectetur adipisicing elit. Similique error sit consectetur dolore sunt nisi hic eum repellat autem facere quasi rem iusto repudiandae quisquam totam placeat dolores, deleniti quaerat!</p>
        <div>
            Elemento DIV
        </div>
        <script>
            var myParagrafo = document.getElementById("paragrafo");		
            myParagrafo.onmouseleave = function(e) {
                console.log(e.relatedTarget);
                console.log("Il cursore si trova ora sull'elemento " + e.relatedTarget.tagName);
            };	
        </script>
    </body>
</html>
